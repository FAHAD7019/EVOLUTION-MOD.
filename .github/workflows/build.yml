name: Build EVOLUTION Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Check project files
        run: |
          echo "Checking project..."
          test -f build.gradle || (echo "Missing build.gradle" && exit 1)
          test -f gradle.properties || (echo "Missing gradle.properties" && exit 1)
          test -f src/main/resources/fabric.mod.json || (echo "Missing fabric.mod.json" && exit 1)

      - name: Build JAR
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EVOLUTION-MOD-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
